<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CCode Pac-Man</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffe45c'/%3E%3Cpath d='M32 32 L58 18 A30 30 0 1 0 58 46 Z' fill='%23060819'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <main class="app-shell" aria-label="CCode Pac-Man game">
    <header class="topbar">
      <div class="brand">
        <span class="pill">CCode Arcade</span>
        <h1>Pac-Man</h1>
      </div>
      <div class="top-actions">
        <button id="pauseBtn" class="small-btn" type="button">Pause</button>
        <button id="soundBtn" class="small-btn" type="button" aria-pressed="true">Sound On</button>
      </div>
    </header>

    <section class="scoreboard" aria-label="Game stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>High</span><strong id="high">0</strong></div>
      <div class="stat"><span>Lives</span><strong id="lives">3</strong></div>
      <div class="stat"><span>Level</span><strong id="level">1</strong></div>
      <div class="stat accent"><span>Mode</span><strong id="mode">Ready</strong></div>
    </section>

    <section class="stage" id="stage">
      <canvas id="game" width="448" height="496" aria-label="Playable Pac-Man maze"></canvas>
      <div id="message" class="message">
        <div id="messageTitle">Ready?</div>
        <p id="messageText">Use the buttons, swipes, WASD, or arrow keys. Ghosts patrol immediately and keep moving during play.</p>
        <button id="startBtn" type="button">Start Game</button>
      </div>
    </section>

    <div class="info-row">
      <span id="pellets">Pellets: 0</span>
      <span id="hint">Swipe on the maze or hold a direction.</span>
    </div>

    <nav class="controls" aria-label="Game controls">
      <div class="dpad" aria-label="Movement pad">
        <button class="dir up" data-dir="up" type="button" aria-label="Move up">▲</button>
        <button class="dir left" data-dir="left" type="button" aria-label="Move left">◀</button>
        <button class="dir right" data-dir="right" type="button" aria-label="Move right">▶</button>
        <button class="dir down" data-dir="down" type="button" aria-label="Move down">▼</button>
      </div>
      <div class="control-actions">
        <button id="goBtn" class="primary" type="button">Go</button>
        <button id="restartBtn" class="secondary" type="button">Restart</button>
      </div>
    </nav>
  </main>

  <script src="game.js?v=6"></script>
</body>
</html>
